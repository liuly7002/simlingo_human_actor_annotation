dataset:
  # 建议填写 data_collection.py 生成的数据目录中的 data 层，例如：
  # /home/kemove/ll/simlingo_liulei/database/simlingo_v2_2026_xx_xx/data
  dataset_root: /home/liulei/ll/simlingo_liulei/database/simlingo_v2_2026_07_25_15_05_25/data

  # 预处理 manifest、视频缓存、标注结果都保存在这里。
  work_dir: ./annotation_workspace
  manifest_path: ./annotation_workspace/manifest.jsonl
  annotation_dir: ./annotation_workspace/annotations

  # 项目会按顺序尝试这些目录名，兼容当前六视角命名和旧命名。
  view_aliases:
    front_left: [rgb_front_left, rgb_left_front]
    front: [rgb_front, rgb]
    front_right: [rgb_front_right, rgb_right_front]
    rear_left: [rgb_rear_left, rgb_left_rear, rgb_left_back]
    rear: [rgb_rear, rgb_back]
    rear_right: [rgb_rear_right, rgb_right_rear, rgb_right_back]
  top_rgb_aliases: [top_rgb]
  boxes_aliases: [boxes]
  measurements_aliases: [measurements]

sampling:
  # 10 FPS 数据下，使用当前时刻之前 40 帧和当前帧，首尾时间跨度约 4 秒。
  # 不提供未来帧，视频最后一帧就是当前标注时刻。
  history_frames: 40
  future_frames: 0

  # 每隔 40 帧抽取一条，减少 4 秒片段之间的重复。
  sample_stride: 40
  max_samples: 30
  random_seed: 20260726

  require_all_six_views: true
  require_top_rgb: true
  require_boxes: true

  # 人工界面最多展示 20 个候选。正式实验建议跳过超限样本，
  # 避免真正关键 actor 因界面截断而无法被人工选择。
  max_candidates: 20
  skip_if_candidates_truncated: true
  # 保留没有候选对象的帧，用于评估“无关键 actor”的负样本识别能力。
  include_empty_candidate_samples: true
  max_actor_distance_m: 50.0
  min_actor_forward_m: -8.0

  # 优先抽取自车处于行驶状态的片段。速度阈值 1.0 m/s；
  # 一个片段中至少 50% 的有效帧达到阈值，或中心帧达到阈值，即视为行驶片段。
  prefer_moving_samples: true
  min_ego_speed_mps: 1.0
  min_window_moving_ratio: 0.50

  # 仍保留最多 10% 的静止片段，用于覆盖红灯、排队和障碍停车等必要场景。
  max_stationary_sample_ratio: 0.10
  # measurements 缺失或无法解析时保留样本，避免因数据格式差异导致无样本。
  keep_if_motion_unknown: true

  include_classes:
    [vehicle, car, truck, bus, motorcycle, bicycle, cyclist, pedestrian,
     walker, static, obstacle, traffic_cone, cone]
  exclude_classes: [ego, ego_vehicle, ego_car, hero]

render:
  fps: 10
  mosaic_width: 1280
  current_mosaic_width: 1280
  top_preview_width: 720
  marker_radius_px: 18
  marker_anchor_radius_px: 5
  marker_label_gap_px: 10

  # 通常无需手动填写：程序会优先读取每条路线下的
  # surround_camera_config.json，并由 top_rgb 高度/FOV 自动计算。
  # 如果编号与实际位置整体缩放不一致，再手动填写。
  top_meters_per_pixel: null
  top_ego_center_x_ratio: 0.5
  top_ego_center_y_ratio: 0.5
  forward_is_up: true
  right_is_right: true

app:
  # 单机使用填 127.0.0.1；局域网多人访问填 0.0.0.0。
  host: 127.0.0.1
  port: 7860
  share: false
  show_candidate_table: true
  allow_notes: true
  title: 关键 Actor 人工盲评标注
